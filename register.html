<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-api-base="http://localhost:8000">

  <main class="page">

    <section class="hero">
      <h1>Welcome!</h1>
      <p>Create your account to get started.</p>
    </section>

    <section class="auth">
      <h2>Sign Up</h2>

      <form class="register-form" data-auth-form="register" novalidate>
        <div class="form-alert" role="alert" hidden></div>
        <div class="field">
          <input id="first-name" name="firstName" type="text" placeholder="First name" autocomplete="given-name" required>
        </div>

        <div class="field">
          <input id="last-name" name="lastName" type="text" placeholder="Last name" autocomplete="family-name" required>
        </div>

        <div class="field field--dob"> 
          <label for="dob">Date of birth</label>
          <input id="dob" name="dob" type="date">
        </div>

        <div class="field">
          <input id="mobile" name="mobile" type="tel" inputmode="tel" placeholder="Mobile number" autocomplete="tel">
        </div>

        <div class="field">
          <input id="reg-email" name="email" type="email" placeholder="Email" autocomplete="email" required>
        </div>

        <div class="field">
          <input id="reg-password" name="password" type="password" placeholder="Password" autocomplete="new-password" required>
        </div>

        <div class="field">
          <input id="reg-confirm" name="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" required>
        </div>

        <button type="submit">Create Account</button>

        <p class="create">Already have an account? <a href="index.html">Sign In</a></p>
      </form>
    </section>
  </main>
  <script src="./auth.js"></script>
</body>
</html>
