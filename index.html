<!DOCTYPE html>
<html>
<head>
<title>Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body data-api-base="http://localhost:8000">
    <main class="page">
        <section class="hero">
            <h1 id="welcome">Welcome back!</h1>
            <p>You can sign in to access with your<br>existing account.</p>
        </section>

        <section class="auth">
            <h2 id="sign">Sign In</h2>
            <form class="signin" data-auth-form="login" novalidate>
                <div class="form-alert" role="alert" hidden></div>
                <div class="field">
                    <input id="email" name="identifier" type="email" placeholder="Email" autocomplete="email" required>
                </div>

                <div class="field">
                    <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
                </div>

                <div class="formRow">
                    <label class="remember">
                        <input id="remember" name="remember" type="checkbox">
                        Remember me
                    </label>
                    <a class="forgot" href="">Forgot password?</a>
                </div>

                <button type="submit">Sign In</button>

                <p class="create">New here? <a href="register.html">Create an Account</a></p>
            </form>
        </section>
    </main>
    <script src="./auth.js"></script>
</body>
</html>
